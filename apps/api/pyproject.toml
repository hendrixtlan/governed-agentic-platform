[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-agentic-api"
version = "0.1.0"
description = "FastAPI + LangGraph governed enterprise agentic platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "langgraph>=1.2,<1.3",
  "langchain-aws>=1.8,<1.9",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
